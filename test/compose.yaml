# Ephemeral PostgreSQL + pgvector for the server e2e suite.
#
# Standard Compose file name, so no `-f` is needed from this directory:
#   cd test && docker compose up -d --wait
#
# From the repository root or a package:
#   docker compose -f test/compose.yaml up -d --wait
#
# Podman uses Docker compatibility, not a podman-specific command path. Export the machine's
# Docker socket once and every `docker compose` call below reaches the same engine:
#   export DOCKER_HOST="unix://$(podman machine inspect --format '{{.ConnectionInfo.PodmanSocket.Path}}')"
#
# Full flow:
#   docker compose -f test/compose.yaml up -d --wait
#   DATABASE_URL=postgresql://retaindb_test:retaindb_test@127.0.0.1:55432/retaindb_test \
#     pnpm --filter @retaindb/server run test:db:migrate
#   RETAINDB_TEST_DATABASE_URL=postgresql://retaindb_test:retaindb_test@127.0.0.1:55432/retaindb_test \
#     pnpm --filter @retaindb/server test
#   docker compose -f test/compose.yaml down -v
#
# The data directory is a tmpfs, so `down` throws the database away and nothing is retained.
name: retaindb-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: retaindb_test
      POSTGRES_PASSWORD: retaindb_test
      POSTGRES_DB: retaindb_test
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retaindb_test -d retaindb_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
